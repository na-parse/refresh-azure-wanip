[project]
name = "refresh-azure-wanip"
version = "0.1.0"
description = "Refresh the Azure site WAN IP: new WAN MAC + modem power cycle"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.scripts]
refresh-azure-wanip = "refresh_wanip.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["refresh_wanip"]
