# refresh-azure-wanip configuration
#
# Copy to config.toml (or /etc/refresh-azure-wanip/config.toml) and chmod 600.
# Lookup order: --config PATH, ./config.toml, /etc/refresh-azure-wanip/config.toml

[server]
host = "0.0.0.0"
port = 8780
token = "change-me"            # required in POST /reset data: token=<value>
cooldown_seconds = 600         # minimum time between resets

[unifi]
address = "gw.example.com"     # must resolve via LAN DNS (internet drops mid-reset)
api_key = ""                   # Network API key (X-API-KEY), needs write access
site = "default"               # from the UI URL: /network/<site>/...
wan_network = ""               # required: WAN Name under Settings > Internet
verify_tls = true              # false only when address is an IP / self-signed cert

[modem]
address = "192.168.100.1"
username = ""
password = ""

[plug]
address = "192.168.1.50"       # Shelly Gen2+ plug; digest user is always "admin"
password = ""
switch_id = 0

[reset]
off_seconds = 15               # modem power-off time
mac_prefix = "02:00:00"        # pick your own; must be locally administered unicast
mac_apply_timeout_seconds = 90 # wait for gateway to apply the new MAC
recovery_timeout_seconds = 300 # plug back on -> WAN has a public IP

[notify]                       # optional section; omit to disable notifications
ntfy_topic = ""                # ntfy.sh topic; anyone who knows it can read/post
site = "home"                  # name used in notification messages
